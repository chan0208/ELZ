<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영암중 2학년 하루한줄 글쓰기 영단어</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #1a202c;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .jeopardy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 1rem;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .alphabet-card {
            background-color: #2b6cb0;
            color: #fbd38d;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
            cursor: pointer;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s, background-color 0.2s;
            text-transform: uppercase;
        }

        .alphabet-card:hover:not(.disabled) {
            transform: scale(1.05);
            background-color: #2c5282;
        }

        .alphabet-card.disabled {
            background-color: #4a5568;
            color: #a0aec0;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        #wordModal {
            display: none;
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #2d3748;
            padding: 2.5rem;
            border-radius: 1rem;
            text-align: center;
            position: relative;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: popIn 0.3s ease-out forwards;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .word-display {
            font-size: 2.5rem;
            font-weight: 800;
            color: #63b3ed;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .word-meaning {
            font-size: 1.25rem;
            color: #e2e8f0;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            color: #a0aec0;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-btn:hover { color: white; }

        #statusContainer {
            background-color: #2d3748;
            padding: 1.5rem;
            border-radius: 0.75rem;
            margin-top: 2rem;
        }

        .substitutable {
            text-decoration: underline;
            text-decoration-style: solid;
            text-decoration-color: #fbbf24;
            text-decoration-thickness: 3px;
            text-underline-offset: 4px;
            color: #fde047;
            font-weight: 700;
        }
    </style>
</head>
<body class="p-4 md:p-8 relative">

    <a href="javascript:history.back()" title="뒤로가기" class="absolute top-4 left-4 md:top-8 md:left-8 flex items-center text-gray-400 hover:text-white transition duration-200 cursor-pointer z-10">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 md:mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        <span class="hidden md:inline font-bold text-lg">뒤로가기</span>
    </a>

    <header class="text-center mb-8 mt-12 md:mt-0">
        <h1 class="text-4xl md:text-5xl font-extrabold text-green-400 mb-2 drop-shadow-lg">영암중 2학년 하루한줄 글쓰기 영단어</h1>
        <p class="text-gray-400 text-lg">알파벳을 선택하면 랜덤으로 2개의 단어와 예문이 나타납니다!</p>
        <button id="resetBtn" class="mt-4 bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition duration-200">
            게임 초기화
        </button>
    </header>

    <main class="flex-grow flex flex-col items-center w-full">
        <div id="alphabetGrid" class="jeopardy-grid"></div>

        <div id="statusContainer" class="w-full max-w-4xl shadow-lg border border-gray-700 mb-8">
            <h2 class="text-2xl font-bold mb-4 text-blue-300 border-b border-gray-600 pb-2">사용된 단어 목록 (<span id="usedWordCount">0</span>)</h2>
            <div id="usedWordsList" class="flex flex-wrap gap-2">
                <p class="text-gray-500 italic text-sm w-full">아직 사용된 단어가 없습니다.</p>
            </div>
        </div>
    </main>

    <div id="wordModal">
        <div class="modal-content border-2 border-green-500">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h2 class="text-2xl font-bold text-yellow-500 mb-6 border-b-2 border-gray-600 pb-2 inline-block">오늘의 단어</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-2">
                <div id="card1" class="bg-gray-700 p-6 rounded-lg shadow-inner flex flex-col justify-between">
                    <div>
                        <p class="text-gray-400 mb-2 font-semibold tracking-wider">WORD 1</p>
                        <div id="word1" class="word-display">Word</div>
                        <div id="meaning1" class="word-meaning mb-4 font-medium">뜻</div>
                    </div>
                    <div id="example1" class="text-lg text-gray-200 bg-gray-800 p-4 rounded text-left leading-relaxed shadow-inner break-keep border-l-4 border-green-400">
                    </div>
                </div>
                
                <div id="card2" class="bg-gray-700 p-6 rounded-lg shadow-inner flex flex-col justify-between">
                    <div>
                        <p class="text-gray-400 mb-2 font-semibold tracking-wider">WORD 2</p>
                        <div id="word2" class="word-display">Word</div>
                        <div id="meaning2" class="word-meaning mb-4 font-medium">뜻</div>
                    </div>
                    <div id="example2" class="text-lg text-gray-200 bg-gray-800 p-4 rounded text-left leading-relaxed shadow-inner break-keep border-l-4 border-green-400">
                    </div>
                </div>
            </div>
            
            <button id="nextBtn" class="mt-8 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-10 rounded-full text-lg transition duration-200 shadow-lg">
                확인 완료
            </button>
        </div>
    </div>

    <script>
        const rawWordList = [
            // Lesson 5
            { word: "bench", meaning: "벤치", example: "The bench is next to <span class='substitutable'>the tree</span>." },
            { word: "candle", meaning: "양초", example: "There are three candles on <span class='substitutable'>the cake</span>." },
            { word: "clue", meaning: "단서, 실마리", example: "She found a clue and caught <span class='substitutable'>the thief</span>." },
            { word: "contact", meaning: "연락하다", example: "He decided to contact <span class='substitutable'>his old friend</span>." },
            { word: "crumb", meaning: "부스러기", example: "The bird is eating bread crumbs on <span class='substitutable'>the table</span>." },
            { word: "detective", meaning: "탐정", example: "The detective finally found <span class='substitutable'>a clue</span>." },
            { word: "disappear", meaning: "사라지다", example: "<span class='substitutable'>My black coat</span> disappeared, and I couldn't find it." },
            { word: "earring", meaning: "귀걸이", example: "She bought me new earrings <span class='substitutable'>yesterday</span>." },
            { word: "exact", meaning: "정확한", example: "I need the exact answer to <span class='substitutable'>the question</span>." },
            { word: "handle", meaning: "손잡이", example: "The handle is hard to <span class='substitutable'>pull</span>." },
            { word: "hide", meaning: "숨기다, 감추다", example: "I hid my treasure under <span class='substitutable'>a tree</span>." },
            { word: "item", meaning: "물품", example: "He found a lost item under <span class='substitutable'>the bench</span>." },
            { word: "logically", meaning: "논리적으로", example: "The answer is logically <span class='substitutable'>clear</span>." },
            { word: "medicine", meaning: "약", example: "Take this medicine <span class='substitutable'>three times a day</span>." },
            { word: "mouth", meaning: "입", example: "The girl opened her mouth to say <span class='substitutable'>something</span>." },
            { word: "mud", meaning: "진흙", example: "My dog loves to play in <span class='substitutable'>the mud</span>." },
            { word: "neighbor", meaning: "이웃", example: "My mom baked some cookies for <span class='substitutable'>her neighbors</span>." },
            
            // Lesson 6
            { word: "achieve", meaning: "이루다, 달성하다", example: "She tried hard to achieve <span class='substitutable'>her dream</span>." },
            { word: "admire", meaning: "존경하다", example: "I admire him for <span class='substitutable'>his wisdom</span>." },
            { word: "alive", meaning: "살아 있는", example: "<span class='substitutable'>His great-grandfather</span> is still alive." },
            { word: "astronaut", meaning: "우주 비행사", example: "Who was the first astronaut to go to <span class='substitutable'>the moon</span>?" },
            { word: "awesome", meaning: "엄청난, 굉장한", example: "<span class='substitutable'>This pizza</span> tastes awesome." },
            { word: "ceiling", meaning: "천장", example: "This room has a high <span class='substitutable'>ceiling</span>." },
            { word: "celebrate", meaning: "기념하다", example: "My family will have a party to celebrate <span class='substitutable'>the New Year</span>." },
            { word: "comfortable", meaning: "편안한", example: "I feel comfortable in <span class='substitutable'>my home</span>." },
            { word: "decorate", meaning: "장식하다, 꾸미다", example: "We decorated <span class='substitutable'>the Christmas tree</span>." },
            { word: "direct", meaning: "감독하다. 연출하다", example: "He wants to direct <span class='substitutable'>his own movie</span>." },
            { word: "display", meaning: "전시하다", example: "The artist will display <span class='substitutable'>her artworks</span>." },
            { word: "engine", meaning: "엔진", example: "<span class='substitutable'>The car engine</span> stopped suddenly." },
            { word: "female", meaning: "여성의", example: "She is the only female firefighter <span class='substitutable'>here</span>." },
            { word: "flight", meaning: "비행", example: "The flight took <span class='substitutable'>three hours</span>." },
            { word: "garage", meaning: "차고", example: "The cars are in <span class='substitutable'>the garage</span>." },
            { word: "goggles", meaning: "고글", example: "Goggles protect your eyes from <span class='substitutable'>the sun</span>." },
            { word: "guide", meaning: "인도하다", example: "I need a role model to guide <span class='substitutable'>me</span>." },
            
            // Lesson 7
            { word: "bakery", meaning: "빵집, 제과점", example: "The bakery sells delicious <span class='substitutable'>cakes</span>." },
            { word: "both", meaning: "둘다", example: "Both friends live in <span class='substitutable'>London</span>." },
            { word: "bright", meaning: "밝은", example: "She painted her room in bright <span class='substitutable'>blue colors</span>." },
            { word: "choice", meaning: "선택", example: "Every choice will affect <span class='substitutable'>your life</span>." },
            { word: "clerk", meaning: "점원", example: "Mike is working as a clerk in <span class='substitutable'>the shoe store</span>." },
            { word: "clothing", meaning: "옷, 의류", example: "The store sells clothing for <span class='substitutable'>all ages</span>." },
            { word: "cross out", meaning: "지우다", example: "He crossed out my name from <span class='substitutable'>the list</span>." },
            { word: "deal", meaning: "거래", example: "I bought two T-shirts for 10 dollars, and it was a good <span class='substitutable'>deal</span>." },
            { word: "environment", meaning: "환경", example: "Planting trees is good for <span class='substitutable'>the environment</span>." },
            { word: "fat-free", meaning: "무지방의", example: "He only drinks fat-free <span class='substitutable'>milk</span>." },
            { word: "flavor", meaning: "맛", example: "The candy comes in various <span class='substitutable'>flavors</span>." },
            { word: "local", meaning: "지역의, 현지의", example: "They hold a local festival every <span class='substitutable'>fall</span>." },
            { word: "mug", meaning: "머그잔", example: "She poured hot water into <span class='substitutable'>the mug</span>." },
            { word: "on sale", meaning: "할인 중인", example: "<span class='substitutable'>This T-shirt</span> is on sale today." },
            { word: "option", meaning: "선택권", example: "There are many options for <span class='substitutable'>traveling</span>." },
            { word: "pair", meaning: "쌍, 짝", example: "I bought a pair of <span class='substitutable'>gloves</span>." },
            { word: "producer", meaning: "생산자", example: "The producer grows and sells <span class='substitutable'>vegetables</span>." },
            { word: "product", meaning: "제품, 생산물", example: "She ordered the product from <span class='substitutable'>an online store</span>." },
            
            // Lesson 8
            { word: "be able to", meaning: "~할 수 있다", example: "Are you able to go to <span class='substitutable'>the party</span>?" },
            { word: "bowl", meaning: "그릇", example: "The cat drank some milk from <span class='substitutable'>the bowl</span>." },
            { word: "chase", meaning: "뒤쫓다", example: "The police saw him running and chased <span class='substitutable'>him</span>." },
            { word: "connect", meaning: "연결하다", example: "These cities are connected by <span class='substitutable'>bridges</span>." },
            { word: "fair", meaning: "박람회", example: "Josh will go to the book fair <span class='substitutable'>this Saturday</span>." },
            { word: "flood", meaning: "홍수", example: "The heavy rain caused floods in <span class='substitutable'>many parts of the country</span>." },
            { word: "forecast", meaning: "예측, 예보", example: "The weather forecast is good for <span class='substitutable'>tomorrow</span>." },
            { word: "heal", meaning: "낫게 하다, 치유하다", example: "This cream is good for healing <span class='substitutable'>cuts</span>." },
            { word: "hole", meaning: "구멍", example: "A rabbit disappeared into a big <span class='substitutable'>hole</span>." },
            { word: "look forward to", meaning: "~을 기대하다", example: "He is looking forward to going back <span class='substitutable'>home</span>." },
            { word: "mysterious", meaning: "신비스러운", example: "The island is a mysterious <span class='substitutable'>place</span>." },
            { word: "north", meaning: "북쪽", example: "The birds fly north in <span class='substitutable'>spring</span>." },
            { word: "once upon a time", meaning: "옛날 옛적에", example: "Once upon a time, there was a great <span class='substitutable'>king</span>." },
            { word: "opposite", meaning: "반대쪽의", example: "The park was on the opposite side of <span class='substitutable'>the street</span>." },
            { word: "path", meaning: "길", example: "We followed the path to <span class='substitutable'>the forest</span>." },
            { word: "planet", meaning: "행성", example: "Saturn is the planet with <span class='substitutable'>rings</span> around it." },
            { word: "rocket", meaning: "로켓", example: "These are models of space <span class='substitutable'>rockets</span>." },
            { word: "seed", meaning: "씨, 씨앗", example: "We can grow most vegetables from <span class='substitutable'>seeds</span>." },
            { word: "signing", meaning: "사인회", example: "He went to the book signing by <span class='substitutable'>his favorite writer</span>." }
        ];

        // 중복 방지 로직 및 초기 설정
        const initialWordList = Array.from(
            new Map(rawWordList.map(item => [item.word.toLowerCase(), item])).values()
        );

        let wordList = [];
        let usedWords = [];
        let clickedAlphabets = new Set();
        const storageKeyPrefix = 'yeongam_voca_grade2_'; // 2학년 전용 저장키!

        const alphabetGrid = document.getElementById('alphabetGrid');
        const modal = document.getElementById('wordModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetBtn');
        const usedWordsListContainer = document.getElementById('usedWordsList');
        const usedWordCountSpan = document.getElementById('usedWordCount');

        function loadGameData() {
            const savedWordList = localStorage.getItem(storageKeyPrefix + 'wordList');
            const savedUsedWords = localStorage.getItem(storageKeyPrefix + 'usedWords');
            const savedClickedAlphabets = localStorage.getItem(storageKeyPrefix + 'clickedAlphabets');

            if (savedWordList && savedUsedWords && savedClickedAlphabets) {
                wordList = JSON.parse(savedWordList);
                usedWords = JSON.parse(savedUsedWords);
                clickedAlphabets = new Set(JSON.parse(savedClickedAlphabets));
            } else {
                wordList = JSON.parse(JSON.stringify(initialWordList));
                usedWords = [];
                clickedAlphabets.clear();
            }
        }

        function saveGameData() {
            localStorage.setItem(storageKeyPrefix + 'wordList', JSON.stringify(wordList));
            localStorage.setItem(storageKeyPrefix + 'usedWords', JSON.stringify(usedWords));
            localStorage.setItem(storageKeyPrefix + 'clickedAlphabets', JSON.stringify(Array.from(clickedAlphabets)));
        }

        function initGame() {
            loadGameData();
            renderGrid();
            updateUsedWordsDisplay();
        }

        function resetGame() {
            localStorage.removeItem(storageKeyPrefix + 'wordList');
            localStorage.removeItem(storageKeyPrefix + 'usedWords');
            localStorage.removeItem(storageKeyPrefix + 'clickedAlphabets');
            
            wordList = JSON.parse(JSON.stringify(initialWordList));
            usedWords = [];
            clickedAlphabets.clear();
            
            renderGrid();
            updateUsedWordsDisplay();
        }

        function renderGrid() {
            alphabetGrid.innerHTML = '';
            for (let i = 65; i <= 90; i++) {
                const letter = String.fromCharCode(i);
                const card = document.createElement('div');
                card.className = 'alphabet-card';
                card.textContent = letter;
                
                if (clickedAlphabets.has(letter) || wordList.length === 0) {
                    card.classList.add('disabled');
                } else {
                    card.addEventListener('click', () => handleAlphabetClick(letter));
                }
                
                alphabetGrid.appendChild(card);
            }
        }

        function handleAlphabetClick(letter) {
            if (clickedAlphabets.has(letter) || wordList.length === 0) return;

            shuffleArray(wordList);
            const selectedCount = Math.min(2, wordList.length);
            const selectedWords = wordList.splice(0, selectedCount);
            
            usedWords.push(...selectedWords);
            clickedAlphabets.add(letter);

            saveGameData();

            showModal(selectedWords);
            renderGrid();
            updateUsedWordsDisplay();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function showModal(words) {
            const card1 = document.getElementById('card1');
            const w1Div = document.getElementById('word1');
            const m1Div = document.getElementById('meaning1');
            const e1Div = document.getElementById('example1');
            
            const card2 = document.getElementById('card2');
            const w2Div = document.getElementById('word2');
            const m2Div = document.getElementById('meaning2');
            const e2Div = document.getElementById('example2');
            
            if (words[0]) {
                w1Div.textContent = words[0].word;
                m1Div.textContent = words[0].meaning;
                e1Div.innerHTML = words[0].example;
                card1.style.display = 'flex';
            } else {
                card1.style.display = 'none';
            }

            if (words[1]) {
                w2Div.textContent = words[1].word;
                m2Div.textContent = words[1].meaning;
                e2Div.innerHTML = words[1].example;
                card2.style.display = 'flex';
            } else {
                card2.style.display = 'none';
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function updateUsedWordsDisplay() {
            usedWordCountSpan.textContent = usedWords.length;
            
            if (usedWords.length === 0) {
                usedWordsListContainer.innerHTML = '<p class="text-gray-500 italic text-sm w-full">아직 사용된 단어가 없습니다.</p>';
                return;
            }

            usedWordsListContainer.innerHTML = '';
            const sortedUsedWords = [...usedWords].sort((a, b) => a.word.localeCompare(b.word));

            sortedUsedWords.forEach(item => {
                const tag = document.createElement('span');
                tag.className = 'bg-gray-700 text-gray-300 text-sm font-medium mr-2 mb-2 px-3 py-1 rounded-full border border-gray-600 flex flex-col items-center';
                tag.innerHTML = `<span class="text-green-400 font-bold">${item.word}</span><span class="text-xs text-gray-400 mt-1">${item.meaning}</span>`;
                usedWordsListContainer.appendChild(tag);
            });
        }

        closeModalBtn.addEventListener('click', closeModal);
        nextBtn.addEventListener('click', closeModal);
        resetBtn.addEventListener('click', () => {
            if(confirm("정말 게임을 초기화 하시겠습니까? 진행 상황이 모두 사라집니다.")) {
                resetGame();
            }
        });

        window.addEventListener('click', (event) => {
            if (event.target == modal) {
                closeModal();
            }
        });

        initGame();

    </script>
</body>
</html>
