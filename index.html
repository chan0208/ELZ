<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영암중 하루한줄 글쓰기 영단어</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 80%;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        .grade-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
        }
        .grade-btn:hover {
            background-color: #2980b9;
        }
        .grade-btn:active {
            transform: scale(0.98);
        }
        .grade-btn.grade2 { background-color: #2ecc71; }
        .grade-btn.grade2:hover { background-color: #27ae60; }
        .grade-btn.grade3 { background-color: #9b59b6; }
        .grade-btn.grade3:hover { background-color: #8e44ad; }
    </style>
</head>
<body>
    <div class="container">
        <h1>영암중학교<br>하루 한 줄 글쓰기 영단어 ✍️</h1>
        <a href="./grade1.html" class="grade-btn">1학년 입장하기</a>
        <a href="./grade2.html" class="grade-btn grade2">2학년 입장하기</a>
        <a href="./grade3.html" class="grade-btn grade3">3학년 입장하기</a>
    </div>
</body>
</html>
